manifest: 1
id: tickets
name: Ticket management
version: 1.0.0
icon: ./assets/icon.svg
group: support

frontend:
  dir: ./web
  route: /tickets

tables:
  ticket:
    columns:
      id: { type: uuid, pk: true }
      title: { type: string, required: true }
      status: { type: enum, values: [open, done], default: open }
      customer_id: { type: ref, to: shared.customer }
    crud: true
    rbac:
      read: [user, admin]
      write: [user, admin]

controllers:
  - path: GET /tickets/health
    handler: ./api/health.js
  - path: POST /tickets/:id/close
    handler: ./api/close.js
    needs: [ticket.write]

permissions:
  reads: [shared.customer]

exposes:
  data:
    - ticket
  mcp:
    - name: close_ticket
      description: Closes a ticket by its id
      calls: POST /tickets/:id/close
      input: { id: uuid }

health: /tickets/health
tests: ./smoke.yaml
