manifest: 1
id: customers
name: Customers
version: 1.0.0
icon: ./assets/icon.svg
group: support

frontend:
  dir: ./web
  route: /customers

tables:
  shared.customer:
    columns:
      id: { type: uuid, pk: true }
      name: { type: string, required: true }
      email: { type: string }
    crud: true
    rbac:
      read: [user, admin]
      write: [admin]

exposes:
  data:
    - shared.customer
